<div id="container">
  <div id="spinner" aria-hidden="true">
    <!-- Discord's seasonal spinner. The video is only a decode source; what actually gets
         shown is the canvas, which is redrawn each frame with the white plate keyed out. -->
    <div class="spinner__fallback"><div class="spinner__ring"></div></div>
    <video muted loop playsinline disablepictureinpicture></video>
    <canvas></canvas>
  </div>
  <div id="messages">
    <div id="midtitle">
      <!-- This is autofilled by JS -->
    </div>

    <div id="logContainer">
      <!-- This is autofilled by JS -->
    </div>

    <div id="subtitle">
      <!-- This is autofilled by JS -->
    </div>

    <div id="safemode">
      <p>
        If this seems frozen, press "space" to remove this overlay and continue.
      </p>
      <p>
        You can also press "F" to open your themes/plugins folder, in case any of
        those broke something.
      </p>
      <p>
        Press "S" to restart Clorion in safe mode if startup keeps failing.
      </p>
    </div>
  </div>
</div>
<!-- I'm just gonna be super lazy and put this here since I can get away with it -->
<style>
  #loadingContainer {
    transition: opacity 0.2s ease;
  }

  /* The splash is a fixed overlay; never let it produce a scrollbar. Overflow was making
     the safemode block re-wrap as the page gained/lost a scrollbar, which shifted things. */
  #container {
    position: relative;
    user-select: none;
    text-align: center;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #2f3136;
  }

  /* Spinner is pinned to the true centre of the window, independent of the text,
     so the messages below can never shove it off-centre. */
  #spinner {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 112px;
    height: 112px;
    border-radius: 50%;
    overflow: hidden;
    background: #5865f2;
  }

  /* The video is only a decode source: the canvas is painted fully opaque on top of it, so
     the video can just stay in the layout. It must NOT be hidden -- WebKit refuses to load
     a display:none or fully transparent video, and then drawImage yields nothing
     (readyState stays 0 and the canvas stays blank). */
  #spinner video {
    position: absolute;
    top: 0;
    left: 0;
    width: 112px;
    height: 112px;
    object-fit: cover;
    border-radius: 50%;
  }

  #spinner canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 112px;
    height: 112px;
    display: block;
    /* Already opaque (disc colour is composited in JS), so this is a plain circle. */
    border-radius: 50%;
  }

  /* Soft blurple bloom behind the spinner, so the splash isn't just a disc on a slab */
  #container::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 560px;
    height: 440px;
    transform: translate(-50%, -62%);
    background: radial-gradient(ellipse at center, rgba(88, 101, 242, 0.15), transparent 68%);
    pointer-events: none;
  }

  #messages {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    /* clears the spinner (56px radius), tight enough that the whole block still fits */
    transform: translateY(78px);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #midtitle,
  #subtitle,
  #safemode,
  #logContainer {
    color: #f2f3f5;
  }

  .spinner__fallback {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
  }

  .spinner__fallback.show {
    display: flex;
  }

  .spinner__ring {
    width: 76px;
    height: 76px;
    border: 8px solid #4e5058;
    border-top-color: #5865f2;
    border-radius: 50%;
    animation: spinner-rotate 900ms linear infinite;
  }

  @keyframes spinner-rotate {
    to {
      transform: rotate(360deg);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .spinner__ring {
      animation: none;
    }
  }

  /* Every row has a fixed height and line-height. The status text changes several times
     during startup ("Localizing JS imports..." -> "Getting injection JS..." -> "Done!"),
     and without this the block below it reflows on every change. */
  #midtitle {
    font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #f2f3f5;
    height: 34px;
    line-height: 34px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    white-space: nowrap;
  }

  #logContainer {
    font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.78rem;
    color: #b5bac1;
    opacity: 0.6;
    width: 70%;
    height: 20px;
    line-height: 20px;
    margin: 2px 0 0;
    overflow: hidden;
    text-align: center;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  #subtitle {
    font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 0.78rem;
    font-weight: 400;
    color: #8b8f98;
    height: 18px;
    line-height: 18px;
    margin: 14px 20px 0;
    overflow: hidden;
    white-space: nowrap;
  }

  #safemode {
    opacity: 0;
    margin: 14px 20px 0;
    max-width: 600px;
    font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 0.78rem;
    line-height: 1.5;
    color: #6d7078;
    transition: opacity 1s ease;
  }

  .show {
    opacity: 1 !important;
  }

  @media (prefers-color-scheme: dark) {
    #container {
      background: #2f3136;
    }

    #midtitle,
    #subtitle,
    #safemode,
    #logContainer {
      color: #f2f3f5;
    }
  }

  @media (prefers-color-scheme: light) {
    #container {
      background: #f2f3f5;
    }

    #midtitle,
    #subtitle,
    #safemode,
    #logContainer {
      color: #2f3136;
    }
  }
</style>
